services:
  dokuwiki:
    build:
      context: ./docker
      args:
        # Which DokuWiki release to develop against. Override with
        # DW_VERSION=2025-05-14b docker compose up --build
        DW_VERSION: ${DW_VERSION:-stable}
    ports:
      - "${DW_PORT:-8080}:8080"
    volumes:
      # Plugin source, live: edit on the host, reload the browser.
      - .:/src
      # Seed files are baked into the image too; mounting them means changes
      # here only need a `docker compose restart`, not a rebuild.
      - ./docker/seed:/seed:ro
      # Wiki data survives restarts. Reset with: docker compose down -v
      - storage:/storage

volumes:
  storage:
